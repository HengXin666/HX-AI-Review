name: cf-token-doctor
# Temporary diagnostic: reports what the configured Cloudflare token can actually do, without printing it.
on:
    workflow_dispatch:
jobs:
    doctor:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: verify token
              env:
                  T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: |
                  echo "token length: ${#T}"
                  echo "token prefix: ${T:0:4}..."
                  echo "account id: $A"
                  echo "--- /user/tokens/verify ---"
                  curl -s -H "authorization: Bearer $T" https://api.cloudflare.com/client/v4/user/tokens/verify | head -c 600
                  echo ""
                  echo "--- /accounts ---"
                  curl -s -H "authorization: Bearer $T" https://api.cloudflare.com/client/v4/accounts | head -c 600
                  echo ""
                  echo "--- d1 list ---"
                  curl -s -H "authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts/$A/d1/database" | head -c 600
