name: deploy-cf
# Deploys the Cloudflare side (D1 + migrations, R2, Worker serving the overview SPA as assets).
# Push to main that changes the overview frontend redeploys the Worker assets with the
# repository's existing Cloudflare credentials. A full deploy (migrations-only, or resetting a
# provider key) stays manual.
# Repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, optional HX_PROVIDER_API_KEY.
# Repository variables (optional): HX_ACCESS_AUD, HX_ACCESS_TEAM_DOMAIN, HX_WORKER_NAME, HX_D1_NAME,
# HX_R2_BUCKET, HX_OVERVIEW_DOMAIN, HX_OVERVIEW_URL.
on:
    push:
        branches: [main]
        paths:
            # The overview is not a separate Pages project: vite builds it into the Worker assets.
            # A frontend change therefore redeploys the Worker (target=worker), which ships the new UI.
            - "cf-admin/pages/**"
            - "cf-admin/package.json"
    workflow_dispatch:
        inputs:
            target:
                description: What to deploy
                type: choice
                options: [all, migrations, worker]
                default: all
            provider-key-name:
                description: Worker secret name to (re)set from the HX_PROVIDER_API_KEY secret, e.g. PROVIDER_DEFAULT_KEY. Empty skips.
                type: string
                required: false
                default: ""

permissions:
    contents: read

concurrency:
    group: deploy-cf
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
            - name: Install cf-admin dependencies
              run: pnpm install --frozen-lockfile --filter cf-admin...
            - name: Typecheck and test before deploying
              working-directory: cf-admin
              run: pnpm typecheck && pnpm test
            - name: Deploy
              working-directory: cf-admin
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  # A push has no inputs. Frontend pushes ship the SPA (worker target). Manual runs use the chosen target.
                  HX_DEPLOY_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'worker' }}
                  HX_PROVIDER_KEY_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.provider-key-name || '' }}
                  HX_PROVIDER_KEY_VALUE: ${{ github.event_name == 'workflow_dispatch' && inputs.provider-key-name != '' && secrets.HX_PROVIDER_API_KEY || '' }}
                  HX_ACCESS_AUD: ${{ vars.HX_ACCESS_AUD }}
                  HX_ACCESS_TEAM_DOMAIN: ${{ vars.HX_ACCESS_TEAM_DOMAIN }}
                  HX_WORKER_NAME: ${{ vars.HX_WORKER_NAME }}
                  HX_D1_NAME: ${{ vars.HX_D1_NAME }}
                  HX_R2_BUCKET: ${{ vars.HX_R2_BUCKET }}
                  HX_OVERVIEW_DOMAIN: ${{ vars.HX_OVERVIEW_DOMAIN }}
                  HX_OVERVIEW_URL: ${{ vars.HX_OVERVIEW_URL }}
                  HX_ADMIN_USER: ${{ vars.HX_ADMIN_USER }}
                  HX_ADMIN_PASSWORD: ${{ secrets.HX_ADMIN_PASSWORD }}
                  DEPLOY_SHA: ${{ github.sha }}
                  DEPLOY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: pnpm run deploy
