name: tests-e2e
on:
    pull_request:
        types: [labeled]
    schedule:
        - cron: "0 18 * * *"
    workflow_dispatch:
    workflow_call:
permissions:
    contents: read
jobs:
    e2e:
        if: contains(github.event.pull_request.labels.*.name, 'e2e') || github.event_name != 'pull_request'
        uses: ./.github/workflows/tests-category.yml
        with:
            category: e2e
