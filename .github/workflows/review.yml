name: hx-context-review
# Reusable workflow. Callers: uses: HengXin666/HX-AI-Review/.github/workflows/review.yml@v1
on:
    workflow_call:
        inputs:
            endpoint:
                description: CF Worker base URL serving /init and /runs. Falls back to the caller variable HX_CTX_ENDPOINT.
                type: string
                required: false
                default: ""
            tool-ref:
                description: Ref of HengXin666/HX-AI-Review to run; keep it equal to the ref in uses.
                type: string
                required: false
                default: v1
            kind:
                description: Which review to run. context = are the context files still true; code = is the diff sound. Must match the kind the repository is registered for.
                type: string
                required: false
                default: context
        secrets:
            HX_CTX_TOKEN:
                required: true

jobs:
    review:
        # Fork pull requests are skipped for every PR event, pull_request_target included: their head is
        # untrusted code from another repository and must never run with HX_CTX_TOKEN or a write token.
        if: >-
            github.event.deleted != true &&
            (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: write
            pull-requests: write
        # Serialization and debounce: newer pushes cancel older runs; D1 last_sha keeps the range gap-free.
        concurrency:
            group: hx-context-review-${{ inputs.kind }}-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: true
        # The /init budget claim is tied to this group: cancelling an older run in the same group lets the
        # newer one take over its claim, while runs in other groups still contend for the budget.
        # Credentials are scoped to the CLI steps that need them, never to the whole job.
        env:
            HX_CTX_ENDPOINT: ${{ inputs.endpoint || vars.HX_CTX_ENDPOINT }}
            TOOL: ${{ github.workspace }}/.hx-context-review-tool
            HX_CTX_GROUP: hx-context-review-${{ inputs.kind }}-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
            HX_CTX_KIND: ${{ inputs.kind }}
        steps:
            # The AI stage bounds itself by the time left in this job, so it needs the job's own start
            # time: the 20-minute deadline covers only step 5, while checkout, install, init, L0 and
            # scope run before it and publish needs its reserve after it.
            - name: 0 record job start time
              run: echo "HX_CTX_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
            - name: 1 checkout (fetch-depth 0, full history and context)
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
                  # No token in .git/config: the model's tools run in this tree. publish passes GITHUB_TOKEN per push.
                  persist-credentials: false
            - name: Checkout hx-context-review tool
              uses: actions/checkout@v4
              with:
                  repository: HengXin666/HX-AI-Review
                  ref: ${{ inputs.tool-ref }}
                  path: .hx-context-review-tool
                  persist-credentials: false
            - name: Keep the tool out of the reviewed tree
              run: echo ".hx-context-review-tool/" >> .git/info/exclude
            - uses: pnpm/action-setup@v4
              with:
                  package_json_file: .hx-context-review-tool/package.json
            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
            - name: Install runner dependencies
              working-directory: .hx-context-review-tool
              run: pnpm install --frozen-lockfile --filter context-cr...
            - name: 2 init (GET /init, mask api_key into a 0600 file in RUNNER_TEMP)
              id: init
              env:
                  HX_CTX_TOKEN: ${{ secrets.HX_CTX_TOKEN }}
              run: node "$TOOL/context-cr/src/cli.ts" init
            # Deterministic checks judge whether the context files still match the code, so they belong to
            # context CR only. The runner skips them for kind=code and publishes an empty L0 result.
            - name: 3 L0 deterministic checks (context kind only)
              id: l0
              continue-on-error: true
              run: node "$TOOL/context-cr/src/cli.ts" l0
            - name: 3b rules engine (deterministic, exemption aware)
              id: rules
              continue-on-error: true
              run: node "$TOOL/context-cr/src/cli.ts" rules
            # Dispatches by kind: the context ancestor chain plus reverse references, or the diff hunks.
            - name: 4 scope
              id: scope
              run: node "$TOOL/context-cr/src/cli.ts" scope
            - name: 5 pi finder -> verifier (reads and deletes the key file)
              id: review
              if: steps.scope.outputs.empty != 'true' && steps.init.outputs.l0_only != 'true'
              # The token is needed to POST /spend before the first model session: only a claim marked as
              # spending is settled when a newer run takes it over. Fork PRs never reach this step (job if).
              env:
                  HX_CTX_TOKEN: ${{ secrets.HX_CTX_TOKEN }}
              run: node "$TOOL/context-cr/src/cli.ts" review
            # Not on cancel. After a scope or review failure it still publishes L0, marked incomplete so last_sha stays.
            - name: 6 ingest + write-back (POST /runs, patch branch, comment)
              if: ${{ !cancelled() && steps.init.outcome == 'success' }}
              env:
                  HX_CTX_TOKEN: ${{ secrets.HX_CTX_TOKEN }}
                  GITHUB_TOKEN: ${{ github.token }}
              run: node "$TOOL/context-cr/src/cli.ts" publish
            - name: Upload MD/JSON report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v4
              with:
                  name: hx-context-review-${{ github.run_id }}-${{ github.run_attempt }}
                  path: scripts/.hx_code_quality/reports/
                  include-hidden-files: true
                  if-no-files-found: warn
            - name: Fail on L0 Error (AI findings never fail the job)
              if: steps.l0.outcome == 'failure'
              run: |
                  echo "L0 found blocking Error findings; see the report artifact."
                  exit 1
            - name: Fail on rules Error after exemptions
              if: steps.rules.outcome == 'failure'
              run: |
                  echo "Rules engine found blocking Error findings; see scripts/.hx_code_quality/reports/rules.md."
                  exit 1
