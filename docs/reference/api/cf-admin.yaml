openapi: 3.1.0
info:
    title: hx-context-review cf-admin Worker
    version: 0.5.0
    description: >
        Config delivery, ingest and overview API. Model traffic never passes through this Worker.
        Runner endpoints use the per-repo HX_CTX_TOKEN. /api endpoints accept a Cloudflare Access JWT
        or an hxctx_admin session cookie from POST /api/session. Both unset means 403.
components:
    securitySchemes:
        repoToken:
            type: http
            scheme: bearer
            description: HX_CTX_TOKEN, prefix hxctx_, stored in D1 only as SHA-256
        access:
            type: apiKey
            in: header
            name: Cf-Access-Jwt-Assertion
        session:
            type: apiKey
            in: cookie
            name: hxctx_admin
            description: HMAC session from POST /api/session. HttpOnly, 12h.
    schemas:
        Finding:
            type: object
            required: [ruleId, severity, path, line, message, evidence, fingerprint]
            properties:
                ruleId: { type: string }
                severity: { type: string, enum: [error, warning] }
                path: { type: string }
                line: { type: integer, minimum: 1 }
                message: { type: string }
                evidence: { type: string }
                fingerprint: { type: string }
                origin: { type: string, enum: [new, historical] }
        Patch:
            type: object
            required: [fingerprint, diff, applies]
            properties:
                fingerprint: { type: string }
                diff: { type: string }
                applies: { type: boolean }
        Kind:
            type: string
            enum: [context, code]
            description: >-
                What this run reviews. context checks AI context files (AGENTS.md, README.md, SKILL.md, docs)
                against the code; code reviews the diff itself. A run is always exactly one kind.
        RepoKind:
            type: string
            enum: [context, code, both]
            description: Which reviews a repository serves. both means callers may request either kind.
        Init:
            type: object
            required: [repo, enabled, kind, l0Only, api, models, limits, suppressions]
            properties:
                repo: { type: string }
                enabled: { type: boolean }
                kind: { $ref: "#/components/schemas/Kind" }
                l0Only: { type: boolean }
                reason: { type: string }
                l0Cause:
                    type: string
                    enum: [disabled, mode, budget, config]
                    description: Present when l0Only. budget and config mean the range was not reviewed.
                apiUrl: { type: string, description: Present only when l0Only is false }
                apiKey: { type: string, description: Present only when l0Only is false; runner masks it }
                api: { type: string, enum: [openai-completions, anthropic-messages] }
                models:
                    type: object
                    properties:
                        finder: { type: string }
                        verifier: { type: string }
                limits:
                    type: object
                    properties:
                        contextWindow: { type: integer }
                        maxTokens: { type: integer }
                        maxCandidates: { type: integer }
                        maxRunUsd:
                            type: [number, "null"]
                            description: Remaining monthly budget in USD; null when the repo has no cap
                pricing:
                    type: object
                    description: USD per million tokens
                    properties:
                        input: { type: number }
                        output: { type: number }
                        cacheRead: { type: number }
                        cacheWrite: { type: number }
                lastSha:
                    type: string
                    description: >-
                        The "context reviewed up to here" cursor. Only sent for kind=context, and only a
                        context run may advance it, because a code review says nothing about the context files.
                budgetClaim:
                    type: string
                    description: Opaque budget reservation id; echo it on POST /runs so only this run releases it
                suppressions:
                    type: array
                    items:
                        type: object
                        properties:
                            fingerprint: { type: string }
                            reason: { type: string }
                prompts:
                    type: object
                    description: Active operator addenda. null means that role has none. Missing on older servers.
                    properties:
                        finder:
                            type: [object, "null"]
                            properties:
                                version: { type: integer, minimum: 1 }
                                body: { type: string }
                        verifier:
                            type: [object, "null"]
                            properties:
                                version: { type: integer, minimum: 1 }
                                body: { type: string }
        RunPayload:
            type: object
            required: [repo, sha, findings]
            properties:
                repo: { type: string }
                kind:
                    $ref: "#/components/schemas/Kind"
                    description: >-
                        Defaults to context, which is what every pre-kind runner sent. The repository must serve
                        this kind, so a workflow wired to the wrong kind is a 400 instead of a mislabelled run.
                sha: { type: string }
                baseSha: { type: string }
                event: { type: string }
                prNumber: { type: integer }
                status:
                    type: string
                    enum: [passed, warned, failed, skipped, incomplete]
                    description: >-
                        Always derived by the server: failed (blocking new Error), incomplete (complete is false or
                        the runner sends incomplete), warned or passed by the findings. The runner's skipped is kept
                        only when there are no findings. An unknown value is a 400.
                complete:
                    type: boolean
                    description: false when the AI stage did not finish (session failure, run budget or deadline, or L0-only because of budget or config); last_sha then stays put. Must be a boolean when present.
                    default: true
                l0Only: { type: boolean }
                durationMs: { type: integer }
                usage:
                    type: object
                    properties:
                        input: { type: integer }
                        output: { type: integer }
                        cacheRead: { type: integer }
                        cacheWrite: { type: integer }
                        cost: { type: number }
                counts:
                    type: object
                    properties:
                        error: { type: integer }
                        warning: { type: integer }
                        blocking: { type: integer }
                findings: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/Finding" } }
                patches: { type: array, items: { $ref: "#/components/schemas/Patch" } }
                patchBranch: { type: string }
                budgetClaim:
                    type: string
                    description: >-
                        The budgetClaim from GET /init. Spend is always recorded; the reservation is released only
                        when this matches the live claim, so a run that was refused the budget cannot free another's.
                reportMarkdown: { type: string }
                reportJson: { type: string }
                sessionsJsonl: { type: string }
        Repo:
            type: object
            properties:
                id: { type: integer }
                name: { type: string, description: "owner/repo, case-insensitive" }
                enabled: { type: boolean }
                mode: { type: string, enum: [full, l0] }
                kind: { $ref: "#/components/schemas/RepoKind" }
                provider: { type: string, pattern: "^[A-Za-z0-9._-]{1,64}$" }
                finderModel: { type: string }
                verifierModel: { type: string }
                budgetUsd: { type: number, description: Monthly cap in USD; 0 means no cap }
                spentUsd: { type: number }
                budgetMonth: { type: string }
                lastSha: { type: [string, "null"] }
        RepoPatch:
            type: object
            properties:
                enabled: { type: boolean }
                mode: { type: string, enum: [full, l0] }
                kind: { $ref: "#/components/schemas/RepoKind" }
                provider: { type: string, pattern: "^[A-Za-z0-9._-]{1,64}$" }
                finderModel: { type: string }
                verifierModel: { type: string }
                budgetUsd: { type: number, minimum: 0 }
        RepoCreate:
            allOf:
                - $ref: "#/components/schemas/RepoPatch"
                - type: object
                  required: [name]
                  properties:
                      name: { type: string, pattern: '^[\w.-]+/[\w.-]+$' }
        Provider:
            type: object
            description: Create requires apiUrl, keySecret, priceInput and priceOutput; update keeps omitted fields
            properties:
                apiUrl: { type: string }
                api:
                    {
                        type: string,
                        enum: [openai-completions, anthropic-messages],
                        description: Omitted keeps the stored protocol (new providers default to openai-completions),
                    }
                keySecret:
                    {
                        type: string,
                        pattern: "^[A-Z][A-Z0-9_]{0,63}$",
                        description: Name of the Worker secret holding the key,
                    }
                contextWindow: { type: integer, minimum: 1 }
                maxTokens: { type: integer, minimum: 1 }
                priceInput: { type: number, minimum: 0, description: USD per million input tokens }
                priceOutput: { type: number, minimum: 0, description: USD per million output tokens }
                priceCacheRead: { type: number, minimum: 0, description: USD per million cache-read tokens }
                priceCacheWrite: { type: number, minimum: 0, description: USD per million cache-write tokens }
        Deployment:
            type: object
            properties:
                sha: { type: string }
                deployedAt: { type: string }
                runUrl: { type: string }
                accessConfigured: { type: boolean }
                passwordLogin: { type: boolean, description: True when ADMIN_USER and ADMIN_PASSWORD are both set }
        Token:
            type: object
            required: [token]
            properties:
                token: { type: string, description: "Plaintext HX_CTX_TOKEN, returned only once" }
        Feedback:
            type: object
            required: [verdict]
            properties:
                fingerprint: { type: string, description: Required on /feedback }
                verdict: { type: string, enum: [accepted, rejected] }
                reason: { type: string, description: Required when verdict is rejected }
        RuleSummary:
            type: object
            description: Totals for one rule id over every matching rule result
            required: [ruleId, total, errors, warnings, open, waived, runs, files]
            properties:
                ruleId: { type: string, description: "Canonical id, for example ARCH-003" }
                total: { type: integer }
                errors: { type: integer }
                warnings: { type: integer }
                open: { type: integer }
                waived: { type: integer, description: Rejected by a human; still counted in total }
                runs: { type: integer }
                files: { type: integer }
        SeveritySummary:
            type: object
            required: [severity, total, rules, waived]
            properties:
                severity: { type: string, enum: [error, warning] }
                total: { type: integer }
                rules: { type: integer, description: Distinct rule ids at this severity }
                waived: { type: integer }
        RuleStats:
            type: object
            description: Rule and severity totals over the rule dimension table
            required: [repo, severity, limit, total, waived, byRule, bySeverity, topRule]
            properties:
                repo: { type: [string, "null"], description: Repo filter that was applied; null means all repos }
                severity: { type: [string, "null"], enum: [error, warning, null] }
                limit: { type: integer, description: Maximum rules in byRule; totals still cover every row }
                total: { type: integer, description: Rule hits across every matching row }
                waived: { type: integer }
                byRule: { type: array, items: { $ref: "#/components/schemas/RuleSummary" } }
                bySeverity: { type: array, items: { $ref: "#/components/schemas/SeveritySummary" } }
                topRule: { type: [string, "null"], description: Most triggered rule id }
paths:
    /healthz:
        get:
            operationId: getHealth
            security: []
            description: Unauthenticated liveness probe for the deployment, used by the real test tier.
            responses:
                "200":
                    description: Deployment is serving requests
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [status]
                                properties:
                                    status: { type: string, enum: [ok] }
    /init:
        get:
            operationId: getInit
            security: [{ repoToken: [] }]
            parameters:
                - { name: repo, in: query, required: false, schema: { type: string } }
                - name: group
                  in: query
                  required: false
                  schema: { type: string }
                  description: >-
                      The caller's concurrency group. A live claim from the same group may be taken over,
                      because GitHub cancelled that run to start this one. Empty never matches.
            responses:
                "200":
                    {
                        description: Config,
                        content: { application/json: { schema: { $ref: "#/components/schemas/Init" } } },
                    }
                "401": { description: Missing or unknown token }
                "403": { description: Token belongs to another repository }
    /spend:
        post:
            operationId: postSpend
            security: [{ repoToken: [] }]
            description: >-
                Marks the run's budget claim as having opened a model session. A claim taken over by a newer
                run is settled (charged its allowance) only when it was marked this way, so a run cancelled
                before its first session does not burn the month. Repeating it for the claim this run
                still holds is a no-op.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [budgetClaim]
                            properties:
                                budgetClaim: { type: string }
            responses:
                "200": { description: Recorded }
                "400":
                    description: >-
                        Invalid JSON, a body that is not a JSON object, or a budgetClaim that is missing,
                        empty or not a string
                "401": { description: Missing or unknown token }
                "409":
                    description: >-
                        The claim is no longer held by this run: it is unknown, a newer run has taken it over,
                        or this run already released it in its own POST /runs report. This run must not spend,
                        or the month would be charged twice.
    /runs:
        post:
            operationId: postRun
            security: [{ repoToken: [] }]
            requestBody:
                required: true
                content: { application/json: { schema: { $ref: "#/components/schemas/RunPayload" } } }
            responses:
                "201":
                    description: Stored
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    runId: { type: string }
                                    overviewUrl: { type: string }
                                    resolved:
                                        type: integer
                                        description: Open findings on this pull request marked resolved because they were not reported again. 0 for pushes and when AI findings were not re-checked.
                "400":
                    {
                        description: "Invalid payload: a missing required field or a present field with a wrong type or range",
                    }
    /feedback:
        post:
            operationId: postFeedback
            security: [{ repoToken: [] }]
            requestBody:
                required: true
                content: { application/json: { schema: { $ref: "#/components/schemas/Feedback" } } }
            responses:
                "200": { description: Number of open findings updated }
    /api/overview:
        get:
            operationId: getOverview
            security: [{ access: [] }, { session: [] }]
            responses:
                "200":
                    description: Everything the overview page shows
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    month: { type: string }
                                    deployment: { $ref: "#/components/schemas/Deployment" }
                                    repos: { type: array, items: { $ref: "#/components/schemas/Repo" } }
                                    runs: { type: array, items: { type: object } }
                                    findings: { type: array, items: { type: object } }
                                    resolved:
                                        {
                                            type: array,
                                            items: { type: object },
                                            description: Findings marked resolved by a later commit,
                                        }
                                    prompts: { type: array, items: { type: object } }
                                    notes: { type: array, items: { type: object } }
                                    providers:
                                        type: array
                                        items:
                                            allOf:
                                                - $ref: "#/components/schemas/Provider"
                                                - type: object
                                                  properties:
                                                      name: { type: string }
                                                      keyPresent: { type: boolean }
                "403": { description: No Access identity and no valid session }
    /api/rules:
        get:
            operationId: getRuleStats
            security: [{ access: [] }, { session: [] }]
            description: >-
                Aggregates rule_results by rule id and severity. Canonical rule ids are ARCH-001..ARCH-004,
                STYLE-001..STYLE-004, DOC-001..DOC-002, CTX-001..CTX-002, CI-001, TEST-001..TEST-006 and META-001;
                other ids are accepted and aggregated as they are. A rejected finding sets waived on its rows,
                while total keeps counting it, so the most triggered rule stays visible.
            parameters:
                - name: repo
                  in: query
                  required: false
                  schema: { type: string }
                  description: owner/repo; an unregistered name is a 404, not an empty result
                - name: severity
                  in: query
                  required: false
                  schema: { type: string, enum: [error, warning] }
                - name: limit
                  in: query
                  required: false
                  schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
            responses:
                "200":
                    description: Rule and severity totals
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/RuleStats" }
                "400": { description: Unknown severity, or a limit outside 1..200 }
                "403": { description: No Access identity and no valid session }
                "404": { description: Unknown repository }
    /api/status:
        get:
            operationId: getStatus
            security: [{ access: [] }, { session: [] }]
            responses:
                "200":
                    description: Deployed commit and the Access identity
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    deployment: { $ref: "#/components/schemas/Deployment" }
                                    admin: { type: string }
    /api/repos:
        post:
            operationId: createRepo
            security: [{ access: [] }, { session: [] }]
            requestBody:
                required: true
                content: { application/json: { schema: { $ref: "#/components/schemas/RepoCreate" } } }
            responses:
                "201":
                    description: Repo and its one-time plaintext token
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    repo: { $ref: "#/components/schemas/Repo" }
                                    token: { type: string }
                "400": { description: "Invalid name, or a present field with a wrong type or value" }
                "409": { description: Repository already registered; names compare case-insensitively }
    /api/repos/{owner}/{repo}:
        patch:
            operationId: updateRepo
            security: [{ access: [] }, { session: [] }]
            parameters:
                - { name: owner, in: path, required: true, schema: { type: string } }
                - { name: repo, in: path, required: true, schema: { type: string } }
            requestBody:
                required: true
                content: { application/json: { schema: { $ref: "#/components/schemas/RepoPatch" } } }
            responses:
                "200":
                    description: Updated repo
                    content:
                        application/json:
                            schema: { type: object, properties: { repo: { $ref: "#/components/schemas/Repo" } } }
                "400": { description: A present field with a wrong type or value }
                "404": { description: Unknown repo }
    /api/repos/{owner}/{repo}/rotate-token:
        post:
            operationId: rotateToken
            security: [{ access: [] }, { session: [] }]
            parameters:
                - { name: owner, in: path, required: true, schema: { type: string } }
                - { name: repo, in: path, required: true, schema: { type: string } }
            responses:
                "200":
                    {
                        description: New token,
                        content: { application/json: { schema: { $ref: "#/components/schemas/Token" } } },
                    }
                "404": { description: Unknown repo }
    /api/runs/{owner}/{repo}/{id}/report:
        get:
            operationId: getRunReport
            security: [{ access: [] }, { session: [] }]
            parameters:
                - { name: owner, in: path, required: true, schema: { type: string } }
                - { name: repo, in: path, required: true, schema: { type: string } }
                - { name: id, in: path, required: true, schema: { type: string } }
            responses:
                "200":
                    description: >
                        Report JSON stored for the run. A code review includes trace.groups (the assembled
                        pull-request diff) and trace.checks (the evidence verdict for every candidate).
                    content:
                        application/json:
                            schema: { type: object, additionalProperties: true }
                "404": { description: Unknown run, or the id or repository name is not safe to look up }
    /api/providers/{name}:
        put:
            operationId: upsertProvider
            security: [{ access: [] }, { session: [] }]
            parameters:
                - { name: name, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_.-]{1,64}$" } }
            requestBody:
                required: true
                content: { application/json: { schema: { $ref: "#/components/schemas/Provider" } } }
            responses:
                "200":
                    description: Saved
                    content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } }
                "400":
                    description: >-
                        Invalid name or secret name, a negative price, a non-integer or non-positive contextWindow or
                        maxTokens, an unknown api protocol, or a missing input/output price on create
    /api/findings/{id}/patch:
        get:
            operationId: getPatch
            security: [{ access: [] }, { session: [] }]
            parameters:
                - { name: id, in: path, required: true, schema: { type: string } }
            responses:
                "200": { description: Unified diff, content: { text/x-diff: { schema: { type: string } } } }
                "404": { description: Unknown finding or no patch }
    /api/findings/{id}/feedback:
        post:
            operationId: postFindingFeedback
            security: [{ access: [] }, { session: [] }]
            parameters:
                - { name: id, in: path, required: true, schema: { type: string } }
            requestBody:
                required: true
                content: { application/json: { schema: { $ref: "#/components/schemas/Feedback" } } }
            responses:
                "200":
                    description: Number of open findings updated
                    content:
                        { application/json: { schema: { type: object, properties: { updated: { type: integer } } } } }
    /api/session:
        post:
            operationId: login
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [user, password]
                            properties:
                                user: { type: string }
                                password: { type: string }
            responses:
                "200": { description: Sets hxctx_admin }
                "401": { description: Unknown user or password }
                "403": { description: ADMIN_USER or ADMIN_PASSWORD is unset }
        delete:
            operationId: logout
            responses:
                "200": { description: Clears the session cookie }
    /api/prompts:
        get:
            operationId: listPrompts
            security: [{ access: [] }, { session: [] }]
            responses:
                "200": { description: Versions and rejection notes }
        post:
            operationId: publishPrompt
            security: [{ access: [] }, { session: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [role, body]
                            properties:
                                role: { type: string, enum: [finder, verifier] }
                                body: { type: string, description: At most 4000 bytes }
                                note: { type: string }
            responses:
                "201": { description: Published addendum }
                "400": { description: Empty body, unknown role, or over 4000 bytes }
    /api/prompts/fold:
        post:
            operationId: foldPromptNotes
            security: [{ access: [] }, { session: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [role]
                            properties:
                                role: { type: string, enum: [finder, verifier] }
            responses:
                "201": { description: Notes folded into a new active addendum }
                "400": { description: No unfolded notes, or the folded text exceeds 4000 bytes }
    /api/github/app:
        get:
            operationId: getGithubApp
            security: [{ access: [] }, { session: [] }]
            description: Public fields of the one product GitHub App, plus installations. The PEM and webhook secret are not returned.
            responses:
                "200": { description: configured flag, bot login, install URL, installations }
                "403": { description: No Access identity and no valid session }
        put:
            operationId: putGithubApp
            security: [{ access: [] }, { session: [] }]
            description: Save an already-created GitHub App. The private key is stored and not echoed.
            responses:
                "200": { description: Saved }
                "400": { description: appId, slug, PEM or webhook secret is invalid }
    /api/github/manifest:
        post:
            operationId: startGithubManifest
            security: [{ access: [] }, { session: [] }]
            description: Returns the form target and manifest. The browser POSTs it to GitHub; optional query org selects an organization.
            responses:
                "200": { description: action URL, state, manifest }
                "400": { description: OVERVIEW_URL is unset, or org is not a login }
    /api/github/setup:
        get:
            operationId: finishGithubManifest
            description: GitHub redirects here with code and state. State authorizes the call; no session is required.
            parameters:
                - { name: code, in: query, required: true, schema: { type: string } }
                - { name: state, in: query, required: true, schema: { type: string } }
            responses:
                "200": { description: HTML that returns to the overview }
                "400": { description: Unknown or expired state }
    /github/webhook:
        post:
            operationId: githubWebhook
            description: Installation events. X-Hub-Signature-256 is HMAC-SHA256 of the raw body.
            responses:
                "200": { description: Recorded }
                "401": { description: Bad signature }
    /github/token:
        get:
            operationId: githubInstallationToken
            security: [{ repoToken: [] }]
            description: >-
                Mints an installation token for the repository that owns the bearer token.
                The runner uses it so reviews are authored by the app.
            responses:
                "200": { description: token, expiresAt, bot login, installationId }
                "404": { description: App is not configured, or not installed on this repository }
