openapi: 3.1.0
info:
    title: hx-context-review cf-admin Worker
    version: 0.3.0
    description: >
        Config delivery, ingest and overview API. Model traffic never passes through this Worker.
        Runner endpoints use the per-repo HX_CTX_TOKEN; /api endpoints sit behind Cloudflare Access.
components:
    securitySchemes:
        repoToken:
            type: http
            scheme: bearer
            description: HX_CTX_TOKEN, prefix hxctx_, stored in D1 only as SHA-256
        access:
            type: apiKey
            in: header
            name: Cf-Access-Jwt-Assertion
    schemas:
        Finding:
            type: object
            required: [ruleId, severity, path, line, message, evidence, fingerprint]
            properties:
                ruleId: { type: string }
                severity: { type: string, enum: [error, warning] }
                path: { type: string }
                line: { type: integer, minimum: 1 }
                message: { type: string }
                evidence: { type: string }
                fingerprint: { type: string }
                origin: { type: string, enum: [new, historical] }
        Patch:
            type: object
            required: [fingerprint, diff, applies]
            properties:
                fingerprint: { type: string }
                diff: { type: string }
                applies: { type: boolean }
        Init:
            type: object
            required: [repo, enabled, l0Only, api, models, limits, suppressions]
            properties:
                repo: { type: string }
                enabled: { type: boolean }
                l0Only: { type: boolean }
                reason: { type: string }
                apiUrl: { type: string, description: Present only when l0Only is false }
                apiKey: { type: string, description: Present only when l0Only is false; runner masks it }
                api: { type: string, enum: [openai-completions, anthropic-messages] }
                models:
                    type: object
                    properties:
                        finder: { type: string }
                        verifier: { type: string }
                limits:
                    type: object
                    properties:
                        contextWindow: { type: integer }
                        maxTokens: { type: integer }
                        maxCandidates: { type: integer }
                lastSha: { type: string }
                suppressions:
                    type: array
                    items:
                        type: object
                        properties:
                            fingerprint: { type: string }
                            reason: { type: string }
        RunPayload:
            type: object
            required: [repo, sha, findings]
            properties:
                repo: { type: string }
                sha: { type: string }
                baseSha: { type: string }
                event: { type: string }
                prNumber: { type: integer }
                status: { type: string, enum: [passed, warned, failed, skipped] }
                l0Only: { type: boolean }
                durationMs: { type: integer }
                usage:
                    type: object
                    properties:
                        input: { type: integer }
                        output: { type: integer }
                        cost: { type: number }
                counts:
                    type: object
                    properties:
                        error: { type: integer }
                        warning: { type: integer }
                        blocking: { type: integer }
                findings: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/Finding" } }
                patches: { type: array, items: { $ref: "#/components/schemas/Patch" } }
                patchBranch: { type: string }
                reportMarkdown: { type: string }
                reportJson: { type: string }
                sessionsJsonl: { type: string }
        Feedback:
            type: object
            required: [verdict]
            properties:
                fingerprint: { type: string, description: Required on /feedback }
                verdict: { type: string, enum: [accepted, rejected] }
                reason: { type: string, description: Required when verdict is rejected }
paths:
    /init:
        get:
            operationId: getInit
            security: [{ repoToken: [] }]
            parameters:
                - { name: repo, in: query, required: false, schema: { type: string } }
            responses:
                "200":
                    {
                        description: Config,
                        content: { application/json: { schema: { $ref: "#/components/schemas/Init" } } },
                    }
                "401": { description: Missing or unknown token }
                "403": { description: Token belongs to another repository }
    /runs:
        post:
            operationId: postRun
            security: [{ repoToken: [] }]
            requestBody:
                required: true
                content: { application/json: { schema: { $ref: "#/components/schemas/RunPayload" } } }
            responses:
                "201":
                    description: Stored
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    runId: { type: string }
                                    overviewUrl: { type: string }
                "400": { description: Invalid payload }
    /feedback:
        post:
            operationId: postFeedback
            security: [{ repoToken: [] }]
            requestBody:
                required: true
                content: { application/json: { schema: { $ref: "#/components/schemas/Feedback" } } }
            responses:
                "200": { description: Number of open findings updated }
    /api/overview:
        get:
            operationId: getOverview
            security: [{ access: [] }]
            responses:
                "200": { description: Repos, recent runs and open findings }
                "403": { description: No valid Access identity }
    /api/repos:
        post:
            operationId: createRepo
            security: [{ access: [] }]
            responses:
                "201": { description: Repo and its one-time plaintext token }
    /api/repos/{owner}/{repo}:
        patch:
            operationId: updateRepo
            security: [{ access: [] }]
            parameters:
                - { name: owner, in: path, required: true, schema: { type: string } }
                - { name: repo, in: path, required: true, schema: { type: string } }
            responses:
                "200": { description: Updated repo }
    /api/repos/{owner}/{repo}/rotate-token:
        post:
            operationId: rotateToken
            security: [{ access: [] }]
            parameters:
                - { name: owner, in: path, required: true, schema: { type: string } }
                - { name: repo, in: path, required: true, schema: { type: string } }
            responses:
                "200": { description: New one-time plaintext token }
    /api/providers/{name}:
        put:
            operationId: upsertProvider
            security: [{ access: [] }]
            parameters:
                - { name: name, in: path, required: true, schema: { type: string } }
            responses:
                "200": { description: Saved }
    /api/findings/{id}/patch:
        get:
            operationId: getPatch
            security: [{ access: [] }]
            parameters:
                - { name: id, in: path, required: true, schema: { type: string } }
            responses:
                "200": { description: Unified diff, content: { text/x-diff: {} } }
    /api/findings/{id}/feedback:
        post:
            operationId: postFindingFeedback
            security: [{ access: [] }]
            parameters:
                - { name: id, in: path, required: true, schema: { type: string } }
            requestBody:
                required: true
                content: { application/json: { schema: { $ref: "#/components/schemas/Feedback" } } }
            responses:
                "200": { description: Number of open findings updated }
