# Template for local `wrangler dev`. Deploys use .github/workflows/deploy-cf.yml, which runs
# scripts/deploy.ts to create D1/R2 when missing and write a generated config with the real ids.
name = "hx-context-review"
main = "worker/index.ts"
compatibility_date = "2026-10-01"

[vars]
OVERVIEW_URL = ""
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
# Console login. Both must be non-empty or password login stays off. Override in deploy via
# HX_ADMIN_USER and HX_ADMIN_PASSWORD; these template values are what local `wrangler dev` uses.
ADMIN_USER = "admin"
ADMIN_PASSWORD = "hx-context-review"

[[d1_databases]]
binding = "DB"
database_name = "hx-context-review"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "hx-context-review"

# Live channel (/api/live, /api/live/emit): one RealtimeHub Durable Object per repository room.
# SQLite-backed class (required on the Workers free plan); the class must be exported from worker/index.ts.
[[durable_objects.bindings]]
name = "REALTIME"
class_name = "RealtimeHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RealtimeHub"]
